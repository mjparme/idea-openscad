# Promote the latest SNAPSHOT pre-release to a marketplace release.
# Requires JETBRAINS_PUBLISH_TOKEN repository secret.

name: PromotePreRelease
on: [ workflow_dispatch ]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/wrapper-validation-action@v1.1.0

      - name: Export base version properties
        id: baseProperties
        shell: bash
        run: |
          PROPERTIES="$(./gradlew properties --console=plain -q)"
          VERSION="$(echo "$PROPERTIES" | grep "^version:" | cut -f2- -d ' ')"
          echo "baseVersion=$VERSION" >> $GITHUB_OUTPUT

      - name: Remove SNAPSHOT suffix
        run: sed -i 's/-SNAPSHOT//' gradle.properties

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Export release properties
        id: properties
        shell: bash
        run: |
          PROPERTIES="$(./gradlew properties --console=plain -q)"
          VERSION="$(echo "$PROPERTIES" | grep "^version:" | cut -f2- -d ' ')"
          NAME="$(echo "$PROPERTIES" | grep "^name:" | cut -f2- -d ' ')"
          CHANGELOG="$(./gradlew getChangelog --unreleased --no-header --console=plain -q)"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo 'changelog<<EOF' >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

      - name: Patch Changelog
        run: ./gradlew patchChangelog

      - name: Commit release version
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Release ${{ steps.properties.outputs.version }}"
          skip_fetch: true

      - name: Export release commit
        id: sha
        shell: bash
        run: echo "releaseSha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ steps.properties.outputs.version }}
          tag: ${{ steps.properties.outputs.version }}
          commit: ${{ steps.sha.outputs.releaseSha }}
          body: ${{ steps.properties.outputs.changelog }}
          artifacts: ./build/distributions/${{ steps.properties.outputs.name }}-${{ steps.properties.outputs.version }}.zip
          artifactContentType: application/zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete previous pre-release
        uses: dev-drprasad/delete-tag-and-release@v1.0.1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.baseProperties.outputs.baseVersion }}

      - name: Bump to next dev version
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("gradle.properties")
          content = path.read_text()
          match = re.search(r"^pluginVersion = (\d+)\.(\d+)\.(\d+)$", content, re.MULTILINE)
          if not match:
              raise SystemExit("Expected release pluginVersion in gradle.properties")
          major, minor, patch = map(int, match.groups())
          patch += 1
          content = re.sub(
              r"^pluginVersion = .*$",
              f"pluginVersion = {major}.{minor}.{patch}-SNAPSHOT",
              content,
              count=1,
              flags=re.MULTILINE,
          )
          path.write_text(content)
          PY

      - name: Commit dev version
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "To dev version"
          skip_fetch: true
